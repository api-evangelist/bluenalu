aid: bluenalu
name: BlueNalu
description: 'BlueNalu, Inc. is a San Diego, California cellular aquaculture company
  founded in 2017 by Lou Cooperhouse, Chris Somogyi and Chris Dammann that produces
  cell-cultivated seafood — real seafood grown directly from fish cells rather than
  harvested from the ocean. Its lead product is cell-cultivated bluefin tuna toro,
  marketed as "Seafood Without Compromise", targeted first at premium foodservice
  operators in the United States and then internationally. The company has raised
  approximately $84 million to date, including a Series B and a December 2025 insider-led
  convertible note and preferred stock financing led by Agronomics, Siddhi Capital
  and Lewis & Clark AgriFood, and was the first cell-cultivated seafood company admitted
  to the National Fisheries Institute. BlueNalu is a food and biotechnology producer;
  it publishes a marketing website and no public developer or API surface.'
